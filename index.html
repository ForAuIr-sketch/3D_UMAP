<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D UMAP · CellMajortype</title>
  <!-- inline favicon: avoids the automatic /favicon.ico request (and its 404) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%234FD8C8'/></svg>">
  <link rel="stylesheet" href="css/style.css">

  <!-- All Three.js modules are pinned to the same version (r160).
       The files are bundled locally in js/vendor/three, so the page also works
       without an internet connection. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three/build/three.module.js",
      "three/addons/": "./js/vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D viewport -->
  <div id="viewport">
    <div id="labels" aria-hidden="true"></div>
    <div id="hud">initialising …</div>
    <div id="hint">drag to rotate · scroll to zoom · right-drag to pan · click a legend entry to highlight</div>
  </div>

  <!-- right-hand legend: CellMajortype only -->
  <aside id="legend" aria-label="CellMajortype legend"></aside>

  <!-- collapsible control panel -->
  <section id="panel">
    <header id="panel-header">
      <span>Controls</span>
      <button type="button" id="panel-toggle" title="collapse / expand">–</button>
    </header>
    <div id="panel-body"></div>
    <div id="log" aria-live="polite"></div>
  </section>

  <!-- status line -->
  <footer id="status">starting …</footer>

  <!-- loading / error overlay -->
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">loading …</div>
  </div>

  <script type="module" src="js/main.js"></script>
  <script>
    // panel collapse (kept out of main.js so the module stays focused on the 3D scene)
    document.getElementById('panel-toggle').addEventListener('click', (e) => {
      const panel = document.getElementById('panel');
      panel.classList.toggle('collapsed');
      e.target.textContent = panel.classList.contains('collapsed') ? '+' : '–';
    });
  </script>
</body>
</html>
